# 工具注册表

tools:
  - class_name: training.tools.financial_search_tool.KeywordSearchTool
    config: 
      index_dir: /data/lzl/workspace/AgenticRAG/data/financial_all/indexes
      top_k: 3
      max_text_len: 500
      retrieval_server_url: "http://localhost:8790"
      type: native
    tool_schema: # tool_schema 主要是给模型看的
      type: function
      function:
        name: keyword_search
        description: 使用关键词匹配（BM25）搜索金融文档
        parameters:
          type: object
          properties:
            query:
              type: string
              description: 搜索查询关键词
          required:
            - query

  - class_name: training.tools.financial_search_tool.SemanticSearchTool
    config:
      index_dir: /data/lzl/workspace/AgenticRAG/data/financial_all/indexes
      top_k: 3
      max_text_len: 500
      retrieval_server_url: "http://localhost:8790"
      type: native
    tool_schema:
      type: function
      function:
        name: semantic_search
        description: 使用语义向量检索金融文档
        parameters:
          type: object
          properties:
            query:
              type: string
              description: 语义搜索查询
          required:
            - query

  - class_name: training.tools.financial_search_tool.GraphSearchTool
    config:
      index_dir: /data/lzl/workspace/AgenticRAG/data/financial_all/indexes
      top_k: 3
      max_text_len: 500
      retrieval_server_url: "http://localhost:8790"
      type: native
    tool_schema:
      type: function
      function:
        name: graph_search
        description: 使用知识图谱搜索金融文档中的实体关系
        parameters:
          type: object
          properties:
            query:
              type: string
              description: 实体关系查询
          required:
            - query

  - class_name: training.tools.financial_search_tool.HybridSearchTool
    config:
      index_dir: /data/lzl/workspace/AgenticRAG/data/financial_all/indexes
      top_k: 3
      max_text_len: 500
      retrieval_server_url: "http://localhost:8790"
      type: native
    tool_schema:
      type: function
      function:
        name: hybrid_search
        description: 使用多个工具进行 RRF 融合检索并重排
        parameters:
          type: object
          properties:
            query:
              type: string
              description: 搜索查询
            tools:
              type: array
              items:
                type: string
              description: 要融合的检索工具列表。列表必须包含2至3个互不重复的字符串；每个元素只能是 "keyword_search"、"semantic_search" 或 "graph_search"。例如 ["keyword_search", "semantic_search"]。
          required:
            - query
            - tools
