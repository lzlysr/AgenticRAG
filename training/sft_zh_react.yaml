### model
model_name_or_path: /data/lzl/workspace/AgenticRAG/models/Qwen3.5-4B
trust_remote_code: true # 允许执行模型仓库里的自定义代码

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64 # LoRA 低秩矩阵的 rank。越大表达能力越强，但显存和参数更多。
lora_target: all # 对尽可能多的线性层挂 LoRA。效果通常更强，成本也更高。

### dataset
dataset: financial_agent_zh_react
template: qwen3_nothink # Qwen3.5的template应该与Qwen3的一致，因为SFT监督训练数据就是这样的格式。
cutoff_len: 2048 # 每条样本最大 token 长度。
overwrite_cache: true # 是否覆盖缓存的处理结果
preprocessing_num_workers: 16 # 数据预处理时的进程数
dataset_dir: /data/lzl/workspace/AgenticRAG/LLaMA-Factory/data # LLaMA-Factory 找 dataset_info.json 的目录

### output
output_dir: /data/lzl/workspace/AgenticRAG/training/outputs/Qwen3.5-4B-sft-zh
logging_steps: 5 # 每 5 step 打印一次训练日志。
save_steps: 45 # 每 45 step 保存一个 checkpoint。刚好对应一个epoch。
plot_loss: true
overwrite_output_dir: true
report_to: none # 不上传 wandb/tensorboard 等平台。

### train
per_device_train_batch_size: 1 # 单卡 batch size。Qwen3.5 在 24GB 4090 上用 1 更稳。
gradient_accumulation_steps: 16 # 梯度累积 16 次再更新一次，等效 batch size 仍约等于 1 * 16 = 16。
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
gradient_checkpointing: true # 用计算换显存，显著降低长序列 SFT 的激活显存。
bf16: true # 4090 支持 BF16；相比 FP16 数值范围更稳。
fp16: false
ddp_timeout: 180000000 # 分布式训练超时时间，单卡时基本不用管。

### eval
val_size: 0.1 # 从训练数据里切 10% 做验证集。
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 45 # 刚好对应一个epoch。
